main = "src/worker.ts"
# 2026-03-24 is the minimum for the Browser Rendering `env.BROWSER.quickAction` binding method,
# which is how this worker renders (no @cloudflare/puppeteer, no API token). Matches sync-worker.
compatibility_date = "2026-03-24"
compatibility_flags = ["nodejs_compat"]

[dev]
port = 8790

# The render page, built from the client's thumbnail-render entry (page.vite.config.ts) and served by
# this worker as static assets, so the page and the worker that drives it deploy as one.
[build]
command = "pnpm build-page"

[assets]
directory = "./.page"

# The page is served on workers.dev, and it has to be a tldraw host: the SDK licenses the editor by
# hostname, and an unlicensed one blanks itself five seconds after it mounts. That page is this
# worker's whole public surface. Rendering is reached only through sync-worker's RENDER_WORKER
# service binding (the RenderWorker entrypoint); any other HTTP request gets a 404 (see the worker's
# fetch handler).
workers_dev = true

#################### Environment names ####################

[env.dev]
name = "dev-tldraw-render-worker"

[env.dev.vars]
# Browser Run is unreachable from local dev, so captures go to the client dev server's Playwright
# endpoint instead of the BROWSER binding — exactly as sync-worker does. Deployed environments leave
# this unset and use the BROWSER binding.
LOCAL_SCREENSHOT_SERVICE_URL = "http://localhost:3000/__screenshot"
# The origin serving the render page. In dev that is the client's dev server, which is where the
# local screenshot service above captures from whatever this says. Deployed environments point at
# this worker's own workers.dev host.
RENDER_PAGE_ORIGIN = "http://localhost:3000"

# preview has no hard-coded name; the deploy script generates it at build time (as for sync-worker).

[env.staging]
name = "staging-tldraw-render-worker"

[env.staging.vars]
RENDER_PAGE_ORIGIN = "https://staging-tldraw-render-worker.tldraw.workers.dev"

[env.production]
name = "tldraw-render-worker"

[env.production.vars]
RENDER_PAGE_ORIGIN = "https://tldraw-render-worker.tldraw.workers.dev"

#################### Browser Rendering (Quick Actions) ####################
# Named environments do not inherit the top-level binding, so it is repeated per environment.

[env.dev.browser]
binding = "BROWSER"

[env.preview.browser]
binding = "BROWSER"

[env.staging.browser]
binding = "BROWSER"

[env.production.browser]
binding = "BROWSER"

#################### browser_run_session spend ledger ####################
# The SAME MEASURE dataset sync-worker writes to, so a session row lands alongside the request-level
# events (the dataset defaults to the binding name, as in sync-worker). This worker writes ONLY
# `browser_run_session` and `render_shadow_compare`, and neither carries board identity — so this
# binding does not widen the identity surface. Note: the events' worker-name blob becomes this
# worker's name, not sync-worker's.

[[env.dev.analytics_engine_datasets]]
binding = "MEASURE"

[[env.preview.analytics_engine_datasets]]
binding = "MEASURE"

[[env.staging.analytics_engine_datasets]]
binding = "MEASURE"

[[env.production.analytics_engine_datasets]]
binding = "MEASURE"

#################### Headless editor (screenshot shadow) ####################
# Deployed separately, so it must exist before this worker deploys. Staging only:
# there is no dev or production headless worker, and binding a service that does not exist fails the
# deploy. Whether a render is compared is sync-worker's `headless_shadow` flag.

[[env.staging.services]]
binding = "HEADLESS_WORKER"
service = "staging-tldraw-headless-worker"

#################### Sentry release tagging ####################
# createSentry needs this to tag releases. Repeated per environment, as elsewhere in dotcom.

[version_metadata]
binding = "CF_VERSION_METADATA"

[env.dev.version_metadata]
binding = "CF_VERSION_METADATA"

[env.preview.version_metadata]
binding = "CF_VERSION_METADATA"

[env.staging.version_metadata]
binding = "CF_VERSION_METADATA"

[env.production.version_metadata]
binding = "CF_VERSION_METADATA"
