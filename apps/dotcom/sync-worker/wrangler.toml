#################### Browser Rendering binding ####################
# Drives the thumbnail render page through a Cloudflare-hosted headless browser (see
# sharedBoardScreenshotMcp.ts). Chrome runs in Cloudflare's Browser Rendering fleet, not in this
# worker's isolate. The dev binding is intentionally NOT marked `remote`: a remote binding makes
# `wrangler dev` require a CLOUDFLARE_API_TOKEN, which the credential-free process-compose e2e stack
# does not have, so it would fail to boot. Local dev therefore gets a non-functional local BROWSER
# binding (the render path fails closed); to exercise real Browser Run locally, run `wrangler dev
# --remote` with Cloudflare credentials, or use a preview deploy.
[env.dev.browser]
binding = "BROWSER"

[env.preview.browser]
binding = "BROWSER"

[env.staging.browser]
binding = "BROWSER"

[env.production.browser]
binding = "BROWSER"

