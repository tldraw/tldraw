main = "src/worker.ts"
# 2026-03-24 is the minimum for the Browser Rendering `env.BROWSER.quickAction` binding method.
compatibility_date = "2026-03-24"
workers_dev = true
compatibility_flags = ["nodejs_compat"]

# Static Assets: the default welcome snapshot (assets/welcome-snapshot.json) is read at seed
# time via the ASSETS binding, so it is not bundled into the worker script. run_worker_first
# keeps the worker in front of every request — the directory is never served publicly; the
# worker only reads the asset through the binding. `assets` is a non-inheritable key and this
# file overrides bindings per environment, so it is repeated in each [env.*] block below.
[assets]
directory = "assets"
binding = "ASSETS"
run_worker_first = true

[dev]
port = 8787
ip = "0.0.0.0"

# these migrations are append-only. you can't change them. if you do need to change something, do so
# by creating new migrations.
# IMPORTANT: when adding a new migration here, also add it to the [[env.preview.migrations]] block below
# env-level migrations fully replace the top-level list, so preview won't inherit new entries.
[[migrations]]
tag = "v1" # Should be unique for each entry
new_classes = ["TLDrawDurableObject"]

[[migrations]]
tag = "v2"
new_classes = ["TLProWorkspaceDurableObject"]

[[migrations]]
tag = "v3"
deleted_classes = ["TLProWorkspaceDurableObject"]

[[migrations]]
tag = "v4"
new_classes = ["TLAppDurableObject"]

[[migrations]]
tag = "v5"
new_sqlite_classes = ["TLPostgresReplicator"]
new_classes = ["TLUserDurableObject"]

[[migrations]]
tag = "v6"
new_sqlite_classes = ["TLLoggerDurableObject"]

[[migrations]]
tag = "v7"
new_sqlite_classes = ["TLStatsDurableObject"]

[[migrations]]
tag = "v8"
deleted_classes = ["TLAppDurableObject"]

[[migrations]]
tag = "v9"
new_sqlite_classes = ["TLFileDurableObject"]

[[migrations]]
tag = "v10"
deleted_classes = ["TLDrawDurableObject"]

[[migrations]]
tag = "v11"
new_sqlite_classes = ["TLFileEffectProcessor"]

# v12 deletes the legacy sync engine's DO classes (their bindings were removed in the
# previous deploy; delete-class must not share a deploy with binding removal). Their no-op
# stub exports in worker.ts stay forever — staging/prod migration history references the
# classes, so removing the exports breaks deploys (see #8124). NOT mirrored in the preview
# list: preview workers deploy fresh and never created these classes (see below).
[[migrations]]
tag = "v12"
deleted_classes = ["TLPostgresReplicator", "TLUserDurableObject", "TLStatsDurableObject"]

# preview workers are fresh deploys, so CF rejects v10's delete-class for
# TLDrawDurableObject (code 10074). skip v1 and v10 here; env-level migrations
# fully replace the top-level list.
# v5 (TLPostgresReplicator + TLUserDurableObject) and v7 (TLStatsDurableObject) are also
# skipped. Their delete-class migration can only ever go in the top-level list, because a
# fresh preview worker replaying create+delete for one class hits the same 10074 as v1/v10
# above. Skipping the creates here keeps preview consistent with that: the classes are
# never created, so preview needs neither the delete nor the classes.
[[env.preview.migrations]]
tag = "v2"
new_classes = ["TLProWorkspaceDurableObject"]

[[env.preview.migrations]]
tag = "v3"
deleted_classes = ["TLProWorkspaceDurableObject"]

[[env.preview.migrations]]
tag = "v4"
new_classes = ["TLAppDurableObject"]

[[env.preview.migrations]]
tag = "v6"
new_sqlite_classes = ["TLLoggerDurableObject"]

[[env.preview.migrations]]
tag = "v8"
deleted_classes = ["TLAppDurableObject"]

[[env.preview.migrations]]
tag = "v9"
new_sqlite_classes = ["TLFileDurableObject"]

[[env.preview.migrations]]
tag = "v11"
new_sqlite_classes = ["TLFileEffectProcessor"]

[[analytics_engine_datasets]]
binding = "MEASURE"

#################### Environment names ####################
# dev should never actually get deployed anywhere
[env.dev]
name = "dev-tldraw-multiplayer"
# The top-level compatibility_date (2026-03-24, required for the Browser Rendering `quickAction`
# binding on deployed environments) is newer than the workerd bundled with our pinned wrangler, so
# `wrangler dev` — and the process-compose e2e stack that runs it — would refuse to start. Local dev
# doesn't drive real Browser Run (the `quickAction` binding is remote-only), so pin dev to a date the
# local workerd supports. Bump this once the pinned wrangler ships a workerd that supports 2026-03-24.
compatibility_date = "2025-06-05"

[env.dev.vars]
BOTCOM_POSTGRES_CONNECTION_STRING = "postgresql://user:password@127.0.0.1:6543/postgres"
BOTCOM_POSTGRES_POOLED_CONNECTION_STRING = "postgresql://user:password@127.0.0.1:6432/postgres"
TLDRAW_ENV = "development"
MULTIPLAYER_SERVER = "http://localhost:3000"
MCP_SCREENSHOT_RENDER_ORIGIN = "http://localhost:3000"
# The MCP server's public URL, and the resource identifier it advertises in protected resource
# metadata and in the WWW-Authenticate challenge. Not compared against an incoming token: Clerk stamps
# no `aud`, so there is no audience binding to check. Points at the client dev server because that is
# what proxies /api and /.well-known through to this worker.
MCP_SERVER_URL = "http://localhost:3000/api/app/mcp"
# Kill switch for the MCP screenshot server (POST /app/mcp). Read per request, so setting it to
# anything but "true" — here or straight in the Cloudflare dashboard — takes the endpoint down
# without a rebuild. A dashboard edit lasts until the next deploy overwrites it from this file.
MCP_SCREENSHOT_ENABLED = "true"
# local-only signing secret; deployments get a real one via deploy vars
MCP_SCREENSHOT_TOKEN_SECRET = "local-dev-thumbnail-render-secret"
# Browser Run is unreachable from local dev (see the BROWSER binding note below), so screenshots go
# to the client dev server, which drives Playwright. Deployed environments leave this unset and use
# the BROWSER binding.
LOCAL_SCREENSHOT_SERVICE_URL = "http://localhost:3000/__screenshot"

# we don't have a hard-coded name for preview. we instead have to generate it at build time and append it to this file.

# staging is the same as a preview on main:
[env.staging]
name = "main-tldraw-multiplayer"
workers_dev = false

[env.staging.vars]
HEALTH_CHECK_DB_SIZE_THRESHOLD_GB = "4"
HEALTH_CHECK_CHANGELOG_SIZE_THRESHOLD_MB = "1024"
HEALTH_CHECK_WAL_SIZE_THRESHOLD_MB = "1024"
MCP_SCREENSHOT_RENDER_ORIGIN = "https://staging.tldraw.com"
MCP_SERVER_URL = "https://staging.tldraw.com/api/app/mcp"
MCP_SCREENSHOT_ENABLED = "true"

# production gets the proper name
[env.production]
name = "tldraw-multiplayer"
workers_dev = false

[env.production.vars]
HEALTH_CHECK_DB_SIZE_THRESHOLD_GB = "10"
HEALTH_CHECK_CHANGELOG_SIZE_THRESHOLD_MB = "1024"
HEALTH_CHECK_WAL_SIZE_THRESHOLD_MB = "2048"
MCP_SCREENSHOT_RENDER_ORIGIN = "https://www.tldraw.com"
MCP_SERVER_URL = "https://www.tldraw.com/api/app/mcp"
MCP_SCREENSHOT_ENABLED = "true"

#################### Routing ####################
# no custom routes for previews and development

[[env.staging.routes]]
zone_name = "tldraw.com"
pattern = "staging.tldraw.com/api/*"

# OAuth protected resource metadata for the MCP server. RFC 9728 puts it at the resource's *origin*,
# under /.well-known/oauth-protected-resource + the resource path, so it falls outside the /api/*
# pattern above and needs its own route. Without it a client fetches the metadata URL, gets the SPA's
# index.html, and never discovers where to authenticate — a failure that logs nothing on our side.
[[env.staging.routes]]
zone_name = "tldraw.com"
pattern = "staging.tldraw.com/.well-known/oauth-protected-resource/*"

[[env.staging.routes]]
custom_domain = true
pattern = "staging-sync.tldraw.xyz"

[[env.production.routes]]
zone_name = "tldraw.com"
pattern = "www.tldraw.com/api/*"

# See the staging comment above.
[[env.production.routes]]
zone_name = "tldraw.com"
pattern = "www.tldraw.com/.well-known/oauth-protected-resource/*"

[[env.production.routes]]
custom_domain = true
pattern = "sync.tldraw.xyz"

