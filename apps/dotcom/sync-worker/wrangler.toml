#################### Rate limiting ####################
[[env.dev.unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 600, period = 60 }

[[env.preview.unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 600, period = 60 }

[[env.staging.unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1003"
simple = { limit = 600, period = 60 }

[[env.production.unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1004"
simple = { limit = 600, period = 60 }

# MCP server per-account request guard: one budget per signed-in caller, across every tool that can
# spend Browser Run. It counts *calls*, not captures, and the clustering tools each run a measure
# render, so ten a minute is nearer three finished screenshots a minute — see MCP_PER_USER_RATE_LIMIT
# in config.ts before changing this number.
# A binding carries one `limit` applied per key, so per-account and per-board need separate bindings to
# hold different numbers. `period` must be 10 or 60. Keep these in step with the fallback constants in
# sharedBoardScreenshotMcp.ts, which are all that unit tests can see.
# The name is the odd one out in this family: it keeps MCP_SCREENSHOT_ because it is deployed and
# counting. It keyed on client IP until the endpoint required authentication; renaming live state buys
# nothing, and the key it counts is now the user id.
[[env.dev.unsafe.bindings]]
name = "MCP_SCREENSHOT_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1005"
simple = { limit = 10, period = 60 }

[[env.preview.unsafe.bindings]]
name = "MCP_SCREENSHOT_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1006"
simple = { limit = 10, period = 60 }

[[env.staging.unsafe.bindings]]
name = "MCP_SCREENSHOT_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1007"
simple = { limit = 10, period = 60 }

[[env.production.unsafe.bindings]]
name = "MCP_SCREENSHOT_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1008"
simple = { limit = 10, period = 60 }

# MCP server per-board capture guard, kept tighter than the per-account one so no single board can
# absorb a caller's whole allowance. Captures only: measure renders are counted against the global
# budget instead, because three of them land on one board in the ordinary cluster-screenshot flow.
[[env.dev.unsafe.bindings]]
name = "MCP_SERVER_BOARD_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1013"
simple = { limit = 2, period = 60 }

[[env.preview.unsafe.bindings]]
name = "MCP_SERVER_BOARD_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1014"
simple = { limit = 2, period = 60 }

[[env.staging.unsafe.bindings]]
name = "MCP_SERVER_BOARD_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1015"
simple = { limit = 2, period = 60 }

[[env.production.unsafe.bindings]]
name = "MCP_SERVER_BOARD_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1016"
simple = { limit = 2, period = 60 }

# global cap on Browser Run invocations from the MCP server (keyed on a single shared key)
