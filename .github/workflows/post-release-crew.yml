name: Post release crew to Discord

# Every Wednesday at 07:07 UTC, post to #development naming the people whose critical
# fixes / significant features are in this week's dotcom release.
# GitHub cron is UTC-only. We use a single fixed UTC time (no BST/GMT adjustment) so
# the job never fires twice: 07:07 UTC is 07:07 in London during winter (GMT) and
# 08:07 during summer (BST). GitHub often starts scheduled runs 15-60 minutes late,
# so this is scheduled early (and off the congested :00/:30 slots) to land before
# the working day ramps up. To change the day, edit the day-of-week field
# (`3` = Wednesday) in the cron line.

on:
  schedule:
    - cron: '7 7 * * 3' # Wednesday 07:07 UTC
  workflow_dispatch: # allow manual runs

concurrency:
  group: post-release-crew

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  post-release-crew:
    name: Post release crew to Discord
    timeout-minutes: 20
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Fail fast if the Discord webhook is not configured
        run: |
          if [ -z "$DISCORD_RELEASE_WEBHOOK_URL" ]; then
            echo "::error::DISCORD_RELEASE_WEBHOOK_URL secret is not set — the release crew message cannot be posted."
            exit 1
          fi
        env:
          DISCORD_RELEASE_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Install Gemini CLI
        run: npm install -g @google/gemini-cli@0.61.0

      # On Actions, Gemini CLI strips every env var it doesn't allowlist from its shell commands, so
      # the skill sees no webhook and skips the post. Names matching /TOKEN/ can't be allowlisted at
      # all, so gh gets a stored login instead of GH_TOKEN.
      - name: Configure Gemini CLI
        run: |
          mkdir -p ~/.gemini
          echo '{"security":{"environmentVariableRedaction":{"allowed":["DISCORD_RELEASE_WEBHOOK_URL"]}}}' > ~/.gemini/settings.json
          gh auth login --with-token <<< "$GH_LOGIN_TOKEN"
        env:
          GH_LOGIN_TOKEN: ${{ github.token }}

      - name: Run dotcom-release-crew skill
        run: gemini --yolo --prompt "Read skills/dotcom-release-crew/SKILL.md and follow its instructions."
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
          DISCORD_RELEASE_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
