name: i18n download strings
on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * 1'

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  download:
    name: 'Download latest strings'
    runs-on: ubuntu-latest
    environment: 'deploy-production'

    permissions:
      # Give the default GITHUB_TOKEN write permission to commit and push the
      # added or changed files to the repository.
      contents: write
      pull-requests: write
      repository-projects: write

    outputs:
      pr_number: ${{ steps.commit.outputs.pr_number }}

    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup

      - name: Download i18n strings
        run: 'pnpm i18n-download-strings'
        env:
          LOKALISE_API_TOKEN: ${{ secrets.LOKALISE_API_TOKEN }}
          LOKALISE_PROJECT_ID: ${{ secrets.LOKALISE_PROJECT_ID }}
          LOKALISE_TLDRAW_PROJECT_ID: ${{ secrets.LOKALISE_TLDRAW_PROJECT_ID }}

      - name: Compile i18n strings
        run: 'pnpm build-i18n'

      - name: Validate the strings
        # The SDK's English lives in main.json; its en.json is an empty stub.
        run: |
          pnpm i18n-check -f react-intl --locales ./apps/dotcom/client/public/tla/locales/ --source en --only invalidKeys
          pnpm i18n-check -f react-intl --locales ./assets/translations/ --source main --only invalidKeys

      - name: Commit and push changes
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global user.name 'huppy-bot[bot]'
          git config --global user.email '128400622+huppy-bot[bot]@users.noreply.github.com'

          # Check if there are any changes to JSON files
          if ! git diff --quiet '*.json' || ! git diff --cached --quiet '*.json'; then
            echo "Changes detected, creating PR..."
          else
            echo "No changes to commit"
            exit 0
          fi

          # Delete the branch if it already exists
          git push origin --delete update-i18n-strings 2>/dev/null || true

          git checkout -b update-i18n-strings
          git add "*.json"
          git commit --no-verify -m '[automated] update i18n strings'
          git push --set-upstream origin update-i18n-strings
          pr_url=$(gh pr create --title "[automated] update i18n strings" --body "This PR updates the i18n strings.

          ### Change type
          - [x] \`other\`" --base main --head update-i18n-strings)
          echo "pr_number=${pr_url##*/}" >> "$GITHUB_OUTPUT"

      - name: Notify Discord on failure
        if: failure()
        uses: ./.github/actions/discord-fail-notify
        with:
          webhook-url: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}

  review:
    name: 'Review translations with Claude'
    needs: download
    if: needs.download.outputs.pr_number != ''
    runs-on: ubuntu-latest
    # The review is advice on the strings PR; failing to produce one must not fail the download.
    continue-on-error: true

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Check out the strings PR
        uses: actions/checkout@v6
        with:
          ref: update-i18n-strings
          fetch-depth: 2
          # Claude reads this checkout, and what it reads includes machine-translated text. Keeping
          # the token off disk means nothing in a string can steer it to the token.
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24.17.0

      - name: Collect the changed strings
        run: node skills/review-translations/scripts/changed-strings.mjs HEAD~1 HEAD > changed-strings.md

      - name: Review with Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.305
          claude -p "Follow skills/review-translations/SKILL.md to review the translations listed in changed-strings.md, which its script produced for this PR's commit. Reply with only the review." \
            --tools Read,Grep,Glob \
            --disallowedTools 'Read(//proc/**)' 'Read(//sys/**)' \
            --model opus \
            --max-budget-usd 10 \
            --output-format text > "$RUNNER_TEMP/review.md"

      - name: Post the review
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.download.outputs.pr_number }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ ! -s "$RUNNER_TEMP/review.md" ]; then
            echo "Claude returned no review."
            exit 0
          fi
          # A string can tell Claude to read /proc/self/environ, which holds the key. GitHub masks
          # secrets in logs but not in comment bodies, so never post a review that carries one.
          if grep -qF "$ANTHROPIC_API_KEY" "$RUNNER_TEMP/review.md" || grep -qE 'sk-ant-[A-Za-z0-9_-]{20,}' "$RUNNER_TEMP/review.md"; then
            echo "The review contains an API key; not posting it."
            exit 1
          fi
          {
            echo '## Translation review'
            echo
            # A PR comment holds at most 65,536 characters.
            head -c 60000 "$RUNNER_TEMP/review.md"
          } > "$RUNNER_TEMP/comment.md"
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"
