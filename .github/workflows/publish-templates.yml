name: Publish templates

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      HUPPY_PRIVATE_KEY:
        required: true
      HUPPY_APP_ID:
        required: true
      DISCORD_DEPLOY_WEBHOOK_URL:
        required: false
      TEMPLATES_TLDRAW_LICENSE_KEY:
        required: true
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

env:
  CI: 1
  PRINT_GITHUB_ANNOTATIONS: 1
  ALLOW_REFRESH_ASSETS_CHANGES: 1

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  publish:
    name: Publish templates
    timeout-minutes: 60
    runs-on: ubuntu-latest-16-cores-arm-open

    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Generate a token
        id: generate_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.HUPPY_APP_ID }}
          private-key: ${{ secrets.HUPPY_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Configure git
        run: |
          git config --global user.name 'huppy-bot[bot]'
          git config --global user.email '128400622+huppy-bot[bot]@users.noreply.github.com'

      - name: Export templates
        env:
          GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}
        run: |
          cd templates
          all_templates=$(ls -d */ | cut -f1 -d'/')
          cd ..

          for template in $all_templates; do
            echo "::group::Exporting $template"
            yarn tsx ./internal/scripts/export-template.ts $template
            echo "::endgroup::"
          done

      # Deploy the cloudflare-hosted demos embedded in the docs. These build from this repo rather
      # than from the exported repos, so the license key comes from one secret here instead of being
      # configured by hand in each cloudflare project. The vercel-hosted demos (chat, shader,
      # workflow) deploy through vercel's own git integration and have no `deploy` config.
      - name: Deploy templates
        env:
          TEMPLATES_TLDRAW_LICENSE_KEY: ${{ secrets.TEMPLATES_TLDRAW_LICENSE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # the templates import tldraw/tldraw.css, which is generated and gitignored
          yarn lazy prebuild

          cd templates
          all_templates=$(ls -d */ | cut -f1 -d'/')
          cd ..

          # the demos are independent of each other, so deploy them all before failing: one broken
          # template shouldn't leave the rest stranded on an old build with no signal about which.
          failed=""
          for template in $all_templates; do
            echo "::group::Deploying $template"
            yarn tsx ./internal/scripts/deploy-template.ts $template || failed="$failed $template"
            echo "::endgroup::"
          done

          if [ -n "$failed" ]; then
            echo "::error::Failed to deploy templates:$failed"
            exit 1
          fi

      - name: Notify Discord on failure
        if: failure()
        uses: ./.github/actions/discord-fail-notify
        with:
          webhook-url: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
