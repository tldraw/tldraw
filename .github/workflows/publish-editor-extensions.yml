name: Publish editor extensions

on:
  push:
    branches:
      - main
      - production

env:
  CI: 1
  PRINT_GITHUB_ANNOTATIONS: 1
defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  publish:
    name: Publish editor extensions
    environment: vsce publish
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: vscode-extension-publish

    steps:
      - name: Generate GH token
        id: generate_token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.HUPPY_APP_ID }}
          private-key: ${{ secrets.HUPPY_APP_PRIVATE_KEY }}

      - name: Check out code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: true
          token: ${{ steps.generate_token.outputs.token }}

      - name: Configure git credentials
        run: git config --global url."https://x-access-token:${{ steps.generate_token.outputs.token }}@github.com/".insteadOf "https://github.com/"

      - uses: ./.github/actions/setup

      - name: Build types
        run: yarn build-types

      - name: Publish extension
        run: yarn tsx ./internal/scripts/publish-editor-extensions.ts
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          TLDRAW_ENV: ${{ (github.ref == 'refs/heads/production' && 'production') || (github.ref == 'refs/heads/main' && 'staging') }}
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}

      # Earlier steps run before checkout, so re-fetch the local action on failure.
      - name: Check out Discord notify action
        if: failure()
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          sparse-checkout: .github/actions/discord-fail-notify

      - name: Notify Discord on failure
        if: failure()
        uses: ./.github/actions/discord-fail-notify
        with:
          webhook-url: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
