name: Checks

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

env:
  CI: 1
  PRINT_GITHUB_ANNOTATIONS: 1

defaults:
  run:
    shell: bash

permissions:
  contents: read
  # update-pr-template reads the repo's label list (octo.issues.listLabelsForRepo).
  issues: read

jobs:
  test:
    name: 'Tests & checks'
    timeout-minutes: 15
    runs-on: ubuntu-latest-16-cores-arm-open # TODO: this should probably run on multiple OSes

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - uses: ./.github/actions/setup

      - name: Check for duplicate dependencies
        run: pnpm dedupe --check

      - name: Check packages
        run: pnpm check-packages

      - name: Check circular dependencies
        run: pnpm check-circular-deps

      - name: Restore build tool caches
        uses: actions/cache@v5
        with:
          # Workspace depths only: a `**` glob follows the workspace symlinks in
          # each package's node_modules and never finishes saving.
          path: |
            .lazy
            */*/.lazy
            apps/*/*/.lazy
            */*/.tsbuild
            apps/*/*/.tsbuild
          key: test-tools-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', '.oxlintrc.json', '.oxfmtrc.json', 'lazy.config.ts') }}

      - name: Typecheck
        run: pnpm build-types

      - name: Check bundle sizes
        run: pnpm exec lazy check-bundle-size

      - name: Check PR template
        run: pnpm update-pr-template --check
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Check API declarations and docs work as intended
        run: pnpm api-check

      - name: Lint
        run: pnpm lint

      - name: Check dotcom localizations
        run: |
          pnpm build-i18n 
          git diff --exit-code --quiet ./apps/dotcom/client/public/tla/locales/ ./apps/dotcom/client/public/tla/locales-compiled/ || (echo "Please run pnpm build-i18n and commit the changes" && exit 1)

      # vitest's fsModuleCache (~54MB gzipped). Entries are content-hashed, so a stale
      # restore is safe - unmatched modules are just re-transformed. Keyed on pnpm-lock.yaml so
      # one entry is reused across commits instead of saving a new copy on every run.
      - name: Restore vitest module cache
        uses: actions/cache@v5
        with:
          path: node_modules/.vitest-cache
          key: vitest-cache-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: vitest-cache-${{ runner.os }}-

      - name: Test
        run: pnpm test-ci

  build:
    name: 'Build all projects'
    timeout-minutes: 15
    runs-on: ubuntu-latest-16-cores-arm-open

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - uses: ./.github/actions/setup

      - name: Restore build tool caches
        uses: actions/cache@v5
        with:
          # Workspace depths only: a `**` glob follows the workspace symlinks in
          # each package's node_modules and never finishes saving.
          path: |
            .lazy
            */*/.lazy
            apps/*/*/.lazy
            */*/.tsbuild
            apps/*/*/.tsbuild
          key: build-tools-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'lazy.config.ts') }}

      - name: Build packages
        # the sed pipe makes sure that github annotations come through without
        # turbo's prefix
        run: "pnpm build-package | sed -E 's/^.*? ::/::/'"
