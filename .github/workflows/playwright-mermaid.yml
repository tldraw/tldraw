name: End to end tests (mermaid readability)

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

env:
  CI: 1
  PRINT_GITHUB_ANNOTATIONS: 1

defaults:
  run:
    shell: bash

jobs:
  check:
    name: 'Check for relevant changes'
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.includes.outputs.match == 'true' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      # Only mermaid conversion changes can affect these checks, unlike the rest of the e2e suites.
      - name: Check for changes to relevant paths
        uses: dorny/paths-filter@v3
        id: includes
        with:
          filters: |
            match:
              - 'packages/mermaid/**'
              - 'apps/examples/src/examples/use-cases/hundred-mermaids/**'
              - 'apps/examples/src/misc/mermaidReadability.ts'
              - 'apps/examples/e2e/mermaid-readability/**'
              - '.github/workflows/playwright-mermaid.yml'
              - '.github/actions/**'
              - 'pnpm-lock.yaml'

  build:
    name: 'End to end tests (mermaid readability)'
    needs: check
    if: needs.check.outputs.relevant == 'true'
    timeout-minutes: 20
    runs-on: ubuntu-latest-16-cores-open

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Run our setup
        uses: ./.github/actions/setup

      - name: Set up Playwright
        uses: ./.github/actions/setup-playwright

      - name: Build examples
        run: pnpm exec lazy refresh-assets && cd apps/examples && pnpm build

      - name: Run Playwright tests (mermaid readability)
        run: 'pnpm e2e-mermaid-readability'
        working-directory: apps/examples

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: playwright-report
          path: apps/examples/playwright-report
          retention-days: 30
