name: 'Setup Playwright'
description: 'Install Playwright browsers with version-keyed caching shared across workflows.'

inputs:
  browsers:
    description: 'Space-separated Playwright browsers to install and cache.'
    required: false
    # Only bundled Chromium by default — every e2e project uses `devices['Desktop Chrome']` /
    # `['Pixel 5']` with no `channel`, so the branded `chrome` build is never launched.
    default: 'chromium'

runs:
  using: 'composite'
  steps:
    # Derive a key-safe browser token (spaces -> dashes) so multi-browser values like
    # "chromium firefox" don't put a space in the cache key.
    - name: Resolve Playwright version and browsers
      shell: bash
      env:
        BROWSERS: ${{ inputs.browsers }}
      run: |
        # A single version keeps the browser cache and the installed browsers matching every
        # workspace's test runner. Two versions would leave one of them without its browsers.
        versions=$(pnpm ls -r --depth 0 --json @playwright/test \
          | jq -r '[.[] | (.dependencies, .devDependencies, .optionalDependencies) | objects | .["@playwright/test"].version | strings] | unique | .[]')
        count=$(echo "$versions" | grep -c . || true)
        if [ "$count" -ne 1 ]; then
          echo "::error::Expected exactly one @playwright/test version across the workspace, found $count: $(echo $versions)"
          pnpm ls -r --depth 0 @playwright/test
          exit 1
        fi
        echo "PLAYWRIGHT_VERSION=$versions" >> "$GITHUB_ENV"
        echo "PLAYWRIGHT_BROWSERS_KEY=$(echo "$BROWSERS" | tr ' ' '-')" >> "$GITHUB_ENV"

    # Keyed on os + arch + version + browsers. The arch matters (ARM vs x64 need different
    # binaries); the browser set matters too — without it, adding a browser would be a stale cache
    # hit that skips the install and never downloads the new one.
    - name: Check for Playwright browsers cache
      id: playwright-cache
      uses: actions/cache@v5
      with:
        path: |
          ~/.cache/ms-playwright
        key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ env.PLAYWRIGHT_VERSION }}-${{ env.PLAYWRIGHT_BROWSERS_KEY }}

    # Cache miss only. `dlx` runs the `playwright` CLI (released in lockstep with `@playwright/test`)
    # without a workspace: the isolated linker gives the root no `playwright` bin. `--with-deps`
    # also installs the OS libraries the browsers need — a no-op for Chromium on GitHub's runner
    # images, but it means adding webkit/firefox via `browsers` later just works without extra setup.
    - name: Install Playwright browsers
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        BROWSERS: ${{ inputs.browsers }}
      run: pnpm dlx "playwright@$PLAYWRIGHT_VERSION" install --with-deps $BROWSERS
