name: Setup tldraw/tldraw
description: Set up node & pnpm

runs:
  using: composite
  steps:
    # see https://github.com/actions/setup-node/issues/899 for one of the reasons why this
    # needs to be done before action/setup-node
    - name: Enable corepack
      run: npm i -g corepack
      shell: bash

    - name: Setup Node.js Environment
      id: setup-node
      uses: actions/setup-node@v6
      with:
        node-version: 24.17.0

    # With the hoisted linker node_modules is a plain tree, so caching it directly (as with
    # Yarn) skips both the fetch and the link step on a hit.
    - name: Restore node_modules cache
      uses: actions/cache@v5
      id: node-modules-cache
      with:
        path: |
          node_modules
          **/node_modules
        key: ${{ runner.os }}-${{ runner.arch }}-node-${{ steps.setup-node.outputs.node-version }}-pnpm-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'patches/*') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-node-${{ steps.setup-node.outputs.node-version }}-pnpm-

    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash
