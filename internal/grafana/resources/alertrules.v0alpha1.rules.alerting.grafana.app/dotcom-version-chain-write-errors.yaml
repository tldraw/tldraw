apiVersion: rules.alerting.grafana.app/v0alpha1
kind: AlertRule
metadata:
  annotations:
    grafana.app/folder: dotcom
    grafana.com/provenance: ''
  labels:
    grafana.app/folder: dotcom
    grafana.com/group: version-chain-alerts
    grafana.com/group-index: '2'
  name: dotcom-version-chain-write-errors
  namespace: stacks-890472
spec:
  annotations:
    description: 'Counts version_chain_error events (the sync worker''s MEASURE dataset,
      production) over the last 10 minutes and fires at 10 or more. Each event is a board
      save whose version-chain write still failed after R2''s retryable errors were retried
      five times: the board saved normally, but that save left no entry in version
      history. The next save''s delta carries its changes, so history only misses the
      board''s state between those two saves. There is no legacy fallback.


      Isolated failures are expected and do not alert: one-off platform errors such as a
      Cloudflare Durable Object storage reset during the chain-state storage.put
      (TLDRAW-SYNC-3Y1, 2026-10-04 and 10-05) show on the panel below without paging.
      The threshold catches bursts like the R2 10058 throttling on chain LISTs (#10879),
      which ran at 10 to 50 a minute in September, and a steady trickle from a bug that
      fails every save on some boards.


      Where to look: the "Chain write errors" panel on the Dotcom events dashboard, then
      Sentry project tldraw-sync, culprit TLFileDurableObject._writeVersionChainEntry (the
      event''s slug extra names the board). Resolved means 10 minutes passed with fewer
      than 10 failures, not that a cause was fixed.'
    summary: 'Version history: 10 or more board saves in the last 10 minutes recorded no
      history entry (the boards themselves saved fine).'
  execErrState: Error
  expressions:
    A:
      datasourceUID: bdgu7tk03irr4e
      model:
        dateTimeType: DATETIME
        editorMode: code
        extrapolate: true
        format: table
        formatAs: table
        intervalFactor: 1
        # See the verify-failures rule: rawQuery is the boolean, and the SQL lives
        # only in `query`, or $from reaches the plugin uninterpolated.
        query: |-
          SELECT count() as errors
          FROM 'MEASURE'
          WHERE timestamp >= toDateTime($from) AND timestamp <= toDateTime($to)
          AND blob1 = 'version_chain_error'
          AND blob2 = 'production-tldraw-multiplayer'
        rawQuery: true
        refId: A
        round: 0s
        skip_comments: true
        step: ''
      relativeTimeRange:
        from: 10m0s
        to: 0s
    C:
      model:
        conditions:
          - evaluator:
              params:
                - 9
              type: gt
            operator:
              type: and
            query:
              params:
                - C
            reducer:
              params: []
              type: last
            type: query
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: C
        type: threshold
      queryType: expression
      source: true
  for: 0s
  labels:
    service: dotcom
    severity: warning
  noDataState: Ok
  notificationSettings:
    receiver: Discord
    type: SimplifiedRouting
  title: Version chain write errors
  trigger:
    interval: 10m
