                        SELECT toStartOfInterval(timestamp, INTERVAL '$interval' SECOND) as date, substring(blob4, 6) as mode, quantileWeighted(0.5, double3, _sample_interval) as p50, quantileWeighted(0.95, double3, _sample_interval) as p95, quantileWeighted(0.99, double3, _sample_interval) as p99
                        FROM 'MEASURE'
                        WHERE timestamp >= toDateTime($from) AND timestamp <= toDateTime($to)
                        AND blob1 = 'browser_run_session'
                        AND blob3 = 'source:mcp'
                        AND blob2 = '${environment}-tldraw-multiplayer'
                        GROUP BY date, mode
                        ORDER BY date ASC
                      round: 0s
                      showFormattedSQL: false
                      showHelp: false
                      skip_comments: true
                      step: ''
                    version: v0
                  refId: A
            queryOptions: {}
            transformations: []
        description: 'Wall-clock per browser session for this server only (source:mcp), from the
