apiVersion: dashboard.grafana.app/v2
kind: Dashboard
metadata:
  annotations:
    grafana.app/folder: dotcom
  labels: {}
  name: mcp-server
  namespace: stacks-890472
spec:
  annotations:
    - kind: AnnotationQuery
      spec:
        builtIn: true
        enable: true
        hide: true
        iconColor: rgba(0, 211, 255, 1)
        name: Annotations & Alerts
        query:
          datasource:
            name: -- Grafana --
          group: grafana
          kind: DataQuery
          spec: {}
          version: v0
  cursorSync: Crosshair
  description:
    The authenticated MCP server on the sync worker at POST /app/mcp, which serves get_board_info,
    get_page_info, get_cluster_info and get_cluster_screenshot for any tldraw.com board the signed-in
    caller can see. Every request needs an OAuth access token from the tldraw Clerk instance and a
    user the mcp_server_access flag names; refusals are on the mcp_server_auth_refusal event. Protocol traffic comes from the mcp_server_tool_call and mcp_server_initialize
    events; the render panels are the source:mcp slice of mcp_shared_board_screenshot, whose
    cross-surface view (og and queue too) stays on Dotcom events. This server only — the separate
    tldraw MCP app worker (apps/mcp-app) and its own MCP_ANALYTICS dataset are on MCP app
    sessions.
  editable: true
  elements:
    panel-1:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
              - kind: PanelQuery
                spec:
                  hidden: false
                  query:
                    datasource:
                      name: bdgu7tk03irr4e
                    group: vertamedia-clickhouse-datasource
                    kind: DataQuery
                    spec:
                      dateTimeType: DATETIME
                      editorMode: code
                      extrapolate: true
                      format: table
                      formatAs: table
                      intervalFactor: 1
                      query: |-
                        SELECT count() as calls
                        FROM 'MEASURE'
                        WHERE timestamp >= toDateTime($from) AND timestamp <= toDateTime($to)
                        AND blob1 = 'mcp_server_tool_call'
                        AND blob2 = '${environment}-tldraw-multiplayer'
                      rawQuery: |-
                        SELECT count() as calls
                        FROM 'MEASURE'
                        WHERE timestamp >= toDateTime($from) AND timestamp <= toDateTime($to)
                        AND blob1 = 'mcp_server_tool_call'
                        AND blob2 = '${environment}-tldraw-multiplayer'
                      round: 0s
                      showFormattedSQL: false
                      showHelp: false
                      skip_comments: true
                      step: ''
                    version: v0
                  refId: A
            queryOptions: {}
            transformations: []
        description: Every tools/call the MCP server dispatched, including ones that failed
          before doing any work.
        id: 1
        links: []
        title: Tool calls
        vizConfig:
          group: stat
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                color:
                  mode: thresholds
                thresholds: &id001
                  mode: absolute
                  steps:
                    - color: green
                      value: 0
                unit: short
              overrides: []
            options:
              colorMode: value
              graphMode: area
              justifyMode: auto
              orientation: auto
              percentChangeColorMode: standard
              reduceOptions:
                calcs:
                  - lastNotNull
                fields: ''
                values: false
              showPercentChange: false
              textMode: auto
              wideLayout: true
          version: 13.2.0-29854286369
    panel-10:
      kind: Panel
      spec:
