                        \tAND blob1 = 'outbox_effect'\n\tGROUP BY date\n\tORDER BY date\
                        \ ASC"
                      round: 0s
                      showFormattedSQL: true
                      skip_comments: true
                      step: ''
                    version: v0
                  refId: A
            queryOptions: {}
            transformations: []
