                        \ SECOND) as date, quantileWeighted(0.5)(double1, _sample_interval)\
                        \ as p50_ms, quantileWeighted(0.95)(double1, _sample_interval)\
                        \ as p95_ms, quantileWeighted(0.99)(double1, _sample_interval)\
