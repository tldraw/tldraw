                        \ >= toDateTime($from) AND timestamp <= toDateTime($to)\n\t\
                        AND blob2 = '${environment}-tldraw-multiplayer'\n\tAND blob1\
                        \ = 'outbox_effect'\n\tGROUP BY date\n\tORDER BY date ASC"
                      intervalFactor: 1
