                        ORDER BY media, shapes
                      rawQuery: |-
                        SELECT if(double7 = 0, 'no media', if(double7 <= 5, '1-5 media', '6+ media')) as media,
                          if(double6 <= 20, '0-20 shapes', if(double6 <= 200, '21-200 shapes', '200+ shapes')) as shapes,
                          sum(_sample_interval) as comparisons,
                          round(100 * sum(if(blob5 = 'outcome:ok', _sample_interval, 0)) / sum(_sample_interval), 1) as both_drew_pct,
                          round(100 * quantileExactWeighted(0.5)(double1, if(double1 >= 0, _sample_interval, 0)), 3) as p50_diff_pct,
                          round(100 * quantileExactWeighted(0.9)(double1, if(double1 >= 0, _sample_interval, 0)), 3) as p90_diff_pct,
                          round(quantileExactWeighted(0.5)(double4, if(blob5 = 'outcome:ok', _sample_interval, 0))) as p50_compare_ms
                        FROM 'MEASURE'
                        WHERE timestamp >= toDateTime($from) AND timestamp <= toDateTime($to)
                        AND blob1 = 'render_shadow_compare'
                        AND blob2 = '${environment}-tldraw-render-worker'
                        AND blob3 = 'op:screenshot'
                        GROUP BY media, shapes
                        ORDER BY media, shapes
                      round: 0s
                      showFormattedSQL: false
                      showHelp: false
                      skip_comments: true
                      step: ''
                    version: v0
                  refId: A
            queryOptions: {}
            transformations: []
        description: >-
          Compared renders bucketed by media assets and page shapes. Where both_drew_pct drops or the
          diff climbs is content headless shouldn't own yet. Diffs are percentages of pixels.
        id: 18
        links: []
        title: Diff and agreement by board content
        vizConfig:
          group: table
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                custom:
                  align: auto
                  cellOptions:
                    type: auto
                  inspect: false
                thresholds:
                  mode: absolute
                  steps:
