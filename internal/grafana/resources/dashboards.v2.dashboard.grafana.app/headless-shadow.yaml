apiVersion: dashboard.grafana.app/v2
kind: Dashboard
metadata:
  annotations:
    grafana.app/folder: dotcom
  labels: {}
  name: headless-shadow
  namespace: stacks-890472
spec:
  annotations:
    - kind: AnnotationQuery
      spec:
        builtIn: true
        enable: true
        hide: true
        iconColor: rgba(0, 211, 255, 1)
        name: Annotations & Alerts
        query:
          datasource:
            name: -- Grafana --
          group: grafana
          kind: DataQuery
          spec: {}
          version: v0
  cursorSync: Crosshair
  description: >-
    Shadow comparison of the headless editor against the user's open tab, on MCP
    get_page_info reads (the render_shadow_compare event, op:measure,
    reference:tab). The server re-measures the page with the headless worker in
    ctx.waitUntil, re-clusters it with the shared algorithm, and records how far
    that clustering diverges from what the tab returned. A cluster id hashes its
    member ids, so cluster agreement is matched / tab clusters — the fraction of
    the tab's clusters the headless path reproduced exactly; bounds deltas are the
    numeric measurement difference, in page units (px at z=1). The lower panels
    are the screenshot shadow (op:screenshot, reference:browser_run): the render
    worker sends sampled OG and thumbnail renders to the headless worker with
    Browser Run's PNG, which diffs the two; its rows come from
    <environment>-tldraw-render-worker. Only staging has a HEADLESS_WORKER binding
    today, so set the Environment variable to staging. See
    apps/dotcom/sync-worker/src/routes/tla/headlessShadow.ts and
    apps/dotcom/render-worker/src/headlessShadow.ts.
  editable: true
  elements:
    panel-1:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
              - kind: PanelQuery
                spec:
                  hidden: false
                  query:
                    datasource:
                      name: bdgu7tk03irr4e
                    group: vertamedia-clickhouse-datasource
                    kind: DataQuery
                    spec:
                      dateTimeType: DATETIME
                      editorMode: code
                      extrapolate: true
                      format: table
                      formatAs: table
                      intervalFactor: 1
                      query: |-
                        SELECT count() as comparisons
                        FROM 'MEASURE'
                        WHERE timestamp >= toDateTime($from) AND timestamp <= toDateTime($to)
                        AND blob1 = 'render_shadow_compare'
                        AND blob2 = '${environment}-tldraw-multiplayer'
                        AND blob3 = 'op:measure'
                      rawQuery: |-
                        SELECT count() as comparisons
                        FROM 'MEASURE'
                        WHERE timestamp >= toDateTime($from) AND timestamp <= toDateTime($to)
                        AND blob1 = 'render_shadow_compare'
                        AND blob2 = '${environment}-tldraw-multiplayer'
                        AND blob3 = 'op:measure'
                      round: 0s
                      showFormattedSQL: false
                      showHelp: false
                      skip_comments: true
                      step: ''
                    version: v0
                  refId: A
            queryOptions: {}
            transformations: []
        description: Every sampled MCP page read the shadow ran a headless comparison for.
        id: 1
        links: []
        title: Comparisons
        vizConfig:
          group: stat
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                color:
                  mode: thresholds
                thresholds:
                  mode: absolute
                  steps:
                    - color: green
                      value: 0
                unit: short
              overrides: []
            options:
              colorMode: value
              graphMode: area
              justifyMode: auto
              orientation: auto
              percentChangeColorMode: standard
              reduceOptions:
                calcs:
                  - lastNotNull
                fields: ''
                values: false
              showPercentChange: false
              textMode: auto
              wideLayout: true
          version: 13.2.0-29854286369
    panel-2:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
              - kind: PanelQuery
                spec:
                  hidden: false
                  query:
                    datasource:
                      name: bdgu7tk03irr4e
                    group: vertamedia-clickhouse-datasource
                    kind: DataQuery
                    spec:
                      dateTimeType: DATETIME
