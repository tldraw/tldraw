                      extrapolate: true
                      format: table
                      formatAs: table
                      intervalFactor: 1
                      query: |-
                        SELECT countIf(blob5 = 'outcome:ok') / count() as ok_rate
                        FROM 'MEASURE'
                        WHERE timestamp >= toDateTime($from) AND timestamp <= toDateTime($to)
                        AND blob1 = 'render_shadow_compare'
                        AND blob2 = '${environment}-tldraw-multiplayer'
                        AND blob3 = 'op:measure'
                      rawQuery: |-
                        SELECT countIf(blob5 = 'outcome:ok') / count() as ok_rate
