apiVersion: notifications.alerting.grafana.app/v1beta1
kind: TemplateGroup
metadata:
  annotations:
    grafana.com/provenance: ''
  name: discord
  namespace: stacks-890472
spec:
  title: discord
  content: |
    {{ define "tldraw.discord.short" -}}
    {{ if eq .Labels.alertname "DatasourceNoData" }}No metrics: {{ .Labels.rulename }}{{ else if .Annotations.summary }}{{ .Annotations.summary }}{{ else }}{{ .Labels.alertname }}{{ end }}
    {{- end }}

    {{ define "tldraw.discord.title" -}}
    {{ if eq .Status "firing" }}🔴{{ else }}✅{{ end }} {{ if gt (len .Alerts) 1 }}[{{ len .Alerts }} alerts] {{ end }}{{ template "tldraw.discord.short" (index .Alerts 0) }}
    {{- end }}

    {{ define "tldraw.discord.alert" -}}
    {{ if eq .Labels.alertname "DatasourceNoData" -}}
    ⚠️ **No metrics** for **{{ .Labels.rulename }}** - the datasource returned no series. Usually the metrics source is down (for Zero rules: Fly.io metrics), not the alert condition itself.
    {{ else -}}
    {{ with .Labels.severity }}**{{ . | toUpper }}** · {{ end }}{{ .Annotations.summary }}
    {{ end -}}
    [View]({{ .GeneratorURL }}) · [Silence]({{ .SilenceURL }}){{ with .DashboardURL }} · [Dashboard]({{ . }}){{ end }}
    {{- end }}

    {{ define "tldraw.discord.text" -}}
    {{ range .Alerts.Firing }}{{ template "tldraw.discord.alert" . }}
    {{ end -}}
    {{ range .Alerts.Resolved }}✅ Resolved: {{ template "tldraw.discord.alert" . }}
    {{ end -}}
    {{- end }}
